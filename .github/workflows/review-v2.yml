name: AI PR Review

on:
  pull_request:
    types: [opened, synchronize]
    # Evita disparar el review en archivos que no aportan valor
    paths-ignore:
      - '**.md'
      - 'package-lock.json'
      - 'yarn.lock'
      - 'assets/**.png'
      - 'assets/**.jpg'

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ai-pr-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Necesario para comparar diffs correctamente

      - name: Get Diff
        id: diff
        run: |
          # Obtenemos el diff directamente de git, filtrando archivos pesados o irrelevantes
          # Incluimos .liquid y .css específicamente
          git diff origin/${{ github.base_ref }}...origin/${{ github.head_ref }} \
            -- . ':(exclude)*.json' ':(exclude)*.map' ':(exclude)dist/*' > pr.diff
          
          # Si el diff es demasiado grande, lo truncamos para no exceder la ventana de contexto
          head -c 50000 pr.diff > pr_trimmed.diff
          echo "diff_exists=$([ -s pr_trimmed.diff ] && echo 'true' || echo 'false')" >> $GITHUB_OUTPUT

      - name: Send to Gemini
        if: steps.diff.outputs.diff_exists == 'true'
        id: gemini
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          DIFF_CONTENT=$(cat pr_trimmed.diff)
          
          # Prompt mejorado y más específico
          PROMPT="Eres un Senior Software Engineer experto en Web Development y Shopify (Liquid/CSS).
          Analiza este diff de un PR y responde en ESPAÑOL.
          
          REGLAS:
          1. Sé crítico pero constructivo.
          2. En Liquid, busca redundancias de código o lógica que pueda afectar la carga.
          3. En CSS/SCSS, busca selectores demasiado específicos o falta de variables.
          4. Si el código es excelente, felicita al autor.
          
          ESTRUCTURA DE RESPUESTA:
          ## 📝 Resumen
          ## 🛠️ Problemas y Mejoras (incluye snippets corregidos)
          ## 🔒 Seguridad y Performance
          ## ⭐ Score: [número del 1 al 10]
          
          Diff:
          $DIFF_CONTENT"

          # Uso de jq para construir el JSON de forma segura (evita errores de escape)
          jq -n --arg msg "$PROMPT" '{contents: [{parts: [{text: $msg}]}]}' > payload.json

          RESPONSE=$(curl -s -X POST \
            -H "Content-Type: application/json" \
            "https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview:generateContent?key=$GEMINI_API_KEY" \
            -d @payload.json)

          # Extraer el texto de forma segura
          COMMENT=$(echo "$RESPONSE" | jq -r '.candidates[0].content.parts[0].text // "Error: No se pudo generar el review."')
          
          # Guardar en un archivo temporal para evitar problemas de caracteres especiales en ENV
          echo "$COMMENT" > comment.md

      - name: Extract Score and Post Comment
        if: steps.diff.outputs.diff_exists == 'true'
        uses: actions/github-script@v7
        env:
          COMMENT_FILE: 'comment.md'
        with:
          script: |
            const fs = require('fs');
            const commentBody = fs.readFileSync(process.env.COMMENT_FILE, 'utf8');
            
            // Extraer score con Regex
            const scoreMatch = commentBody.match(/Score:\s*(\d+)/i);
            const score = scoreMatch ? parseInt(scoreMatch[1]) : 10;
            
            let emoji = score >= 8 ? "🟢" : (score >= 5 ? "🟡" : "🔴");
            
            const finalBody = `## 🤖 AI Code Review ${emoji}\n\n${commentBody}\n\n---\n*Generado por Gemini*`;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number
            });

            const botComment = comments.find(c => c.body.includes("🤖 AI Code Review"));

            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: finalBody
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: finalBody
              });
            }

            if (score < 5) {
              core.setFailed(`PR bloqueado: Score de ${score}/10 es insuficiente.`);
            }
