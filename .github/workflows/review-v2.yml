name: AI PR Review

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ai-pr-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Get PR files
        run: |
          curl -s \
            -H "Authorization: Bearer ${{ github.token }}" \
            ${{ github.api_url }}/repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/files \
            > files.json

      - name: Filter relevant code files
        run: |

          mkdir diffs

          jq -r '
          .[]
          | select(.patch != null)
          | select(.patch | length > 80)

          | select(.filename | test("node_modules|dist|build|coverage|\\.lock|\\.snap|\\.map|\\.min\\.js") | not)

          | select(.filename | test("\\.(ts|tsx|js|jsx|py|go|java|rs|cs|cpp|c|kt|swift)$"))

          | .filename + "|||SPLIT|||" + .patch
          ' files.json > files_filtered.txt

      - name: Stop if nothing to review
        run: |

          if [ ! -s files_filtered.txt ]; then
            echo "No relevant code changes"
            exit 0
          fi

      - name: Build AI batches
        run: |

          mkdir batches

          BATCH_SIZE=4
          BATCH_INDEX=0
          COUNT=0
          CURRENT=""

          while IFS='|||SPLIT|||' read -r FILE PATCH
          do

            PATCH_TRIM=$(echo "$PATCH" | head -n 250)

            CURRENT="${CURRENT}\n\nFile: $FILE\n$PATCH_TRIM"

            COUNT=$((COUNT + 1))

            if [ "$COUNT" -ge "$BATCH_SIZE" ]; then

              echo "$CURRENT" > batches/batch_$BATCH_INDEX.txt

              BATCH_INDEX=$((BATCH_INDEX + 1))
              COUNT=0
              CURRENT=""

            fi

          done < files_filtered.txt

          if [ ! -z "$CURRENT" ]; then
            echo "$CURRENT" > batches/batch_$BATCH_INDEX.txt
          fi

      - name: Run AI reviews in parallel
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |

          mkdir results

          for file in batches/*.txt
          do
          (
            CONTENT=$(cat "$file")

            PROMPT="Eres un Senior Software Engineer haciendo code review.

            Analiza los siguientes cambios.
            
            $CONTENT
            
            Detecta:
            - bugs
            - problemas de seguridad
            - performance
            - malas prácticas
            
            Responde en Markdown.
            
            Estructura:
            
            Problemas detectados
            Seguridad
            Performance
            Mejoras recomendadas
            
            Score:
            Score: número entre 1 y 10
            "

            JSON=$(jq -n --arg prompt "$PROMPT" \
            '{contents:[{parts:[{text:$prompt}]}]}')

            curl -s \
              -H "Content-Type: application/json" \
              "https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview:generateContent?key=$GEMINI_API_KEY" \
              -d "$JSON" \
              | jq -r '.candidates[0].content.parts[0].text' \
              > results/$(basename "$file").md

          ) &
          done

          wait

      - name: Combine results
        run: |

          echo "" > review.md

          TOTAL=0
          COUNT=0

          for file in results/*.md
          do

            cat "$file" >> review.md
            echo "" >> review.md

            SCORE=$(grep -oE 'Score[: ]+[0-9]+' "$file" | grep -oE '[0-9]+' | head -1)

            if [ -z "$SCORE" ]; then
              SCORE=10
            fi

            TOTAL=$((TOTAL + SCORE))
            COUNT=$((COUNT + 1))

          done

          if [ "$COUNT" -eq 0 ]; then
            FINAL_SCORE=10
          else
            FINAL_SCORE=$((TOTAL / COUNT))
          fi

          echo "FINAL_SCORE=$FINAL_SCORE" >> $GITHUB_ENV

          echo "COMMENT<<EOF" >> $GITHUB_ENV
          echo "## 🤖 AI Code Review" >> $GITHUB_ENV
          cat review.md >> $GITHUB_ENV
          echo "" >> $GITHUB_ENV
          echo "## Score final" >> $GITHUB_ENV
          echo "Score: $FINAL_SCORE / 10" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      - name: Comment PR
        uses: actions/github-script@v7
        with:
          script: |

            const score = parseInt(process.env.FINAL_SCORE)

            let emoji = "🟢"
            if (score < 5) emoji = "🔴"
            else if (score < 8) emoji = "🟡"

            const body = `
            ## 🤖 AI Code Review ${emoji}

            ${process.env.COMMENT}

            ---
            Review generado automáticamente
            `

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number
            })

            const botComment = comments.find(comment =>
              comment.body.includes("🤖 AI Code Review")
            )

            if (botComment) {

              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body
              })

            } else {

              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body
              })

            }

      - name: Block PR if score too low
        run: |

          echo "Score final: $FINAL_SCORE"

          if [ "$FINAL_SCORE" -lt 5 ]; then
            echo "❌ PR bloqueado por baja calidad"
            exit 1
          fi
