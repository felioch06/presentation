name: AI PR Review

on:
  pull_request:
    types: [opened, synchronize]
    paths:
      - '**.js'
      - '**.ts'
      - '**.liquid'  # Añadido: Archivos de Shopify
      - '**.css'     # Añadido: Estilos
      - '**.scss'    # Opcional: Sass

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ai-pr-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    runs-on: ubuntu-latest
    if: "!contains(github.event.pull_request.title, '[skip ai]')"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Get changed files from PR
        run: |
          curl -s \
            -H "Authorization: Bearer ${{ github.token }}" \
            ${{ github.api_url }}/repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/files \
            > files.json

      - name: Build filtered diff
        run: |
          # Filtramos archivos basura y limitamos a 50k caracteres
          jq -r '
          .[]
          | select(.patch != null)
          | select(.filename | test("package-lock|dist|build|node_modules|\\.snap|\\.min\\.js|\\.map") | not)
          | "File: " + .filename + "\n" + .patch + "\n"
          ' files.json | head -c 50000 > pr_trimmed.diff

      - name: Send diff to Gemini
        id: gemini
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          sleep 2
          DIFF=$(cat pr_trimmed.diff)
          
          if [ -z "$DIFF" ]; then
            echo "COMMENT=No hay cambios significativos en código, Liquid o CSS para revisar." >> $GITHUB_ENV
            exit 0
          fi

          # Ajustamos el prompt para darle contexto de Shopify/Web
          PROMPT="Eres un Senior Fullstack Engineer experto en Shopify (Liquid) y Frontend. 
          Analiza este PR y responde en español.
          Si hay archivos .liquid, revisa lógica de filtros, objetos de Shopify y rendimiento.
          Si hay CSS, revisa especificidad y posibles bugs visuales.

          Estructura:
          ## Resumen del PR
          ## Problemas detectados (explicación y código corregido)
          ## Seguridad y Performance
          ## Score: X/10 (solo el número)
          
          Diff:
          $DIFF"

          JSON=$(jq -n --arg prompt "$PROMPT" '{contents:[{parts:[{text:$prompt}]}]}')

          RESPONSE=$(curl -s -X POST \
            -H "Content-Type: application/json" \
            "https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=$GEMINI_API_KEY" \
            -d "$JSON")

          COMMENT=$(echo "$RESPONSE" | jq -r '.candidates[0].content.parts[0].text' 2>/dev/null || echo "⚠️ Error: API saturada o respuesta inválida.")

          echo "COMMENT<<EOF" >> $GITHUB_ENV
          echo "$COMMENT" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      - name: Extract Score
        run: |
          # Buscamos la línea que dice Score y extraemos el primer número que aparezca
          SCORE=$(echo "$COMMENT" | grep -i "Score" | sed 's/[^0-9]*//g' | cut -c1-2)
          
          # Validamos que sea un número entre 1 y 10, si no, default a 10
          if [[ ! "$SCORE" =~ ^[0-9]+$ ]] || [ "$SCORE" -gt 10 ]; then
            SCORE=10
          fi
          
          echo "SCORE=$SCORE" >> $GITHUB_ENV

      - name: Comment or update PR review
        uses: actions/github-script@v7
        with:
          script: |
            const score = parseInt(process.env.SCORE);
            let emoji = score < 5 ? "🔴" : score < 8 ? "🟡" : "🟢";
            const body = `## 🤖 AI Code Review ${emoji}\n\n**Score:** ${score}/10\n\n${process.env.COMMENT}\n\n---\n_Review enfocado en Web & Shopify_`;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number
            });

            const botComment = comments.find(c => c.body.includes("🤖 AI Code Review"));

            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner, repo: context.repo.repo,
                comment_id: botComment.id, body
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: context.issue.number, body
              });
            }
