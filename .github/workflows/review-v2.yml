name: AI PR Review

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ai-pr-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get Diff
        id: diff
        run: |
          # Obtenemos el diff directamente de git para mayor precisión
          # Excluimos archivos binarios y locks comunes
          git diff origin/${{ github.base_ref }}...origin/${{ github.head_ref }} \
            -- . ':(exclude)package-lock.json' ':(exclude)yarn.lock' ':(exclude)dist/*' ':(exclude)build/*' \
            > pr.diff
          
          # Truncamos a 40k caracteres para seguridad de tokens (ajustable)
          head -c 40000 pr.diff > pr_trimmed.diff
          echo "diff_exists=$([ -s pr_trimmed.diff ] && echo 'true' || echo 'false')" >> $GITHUB_OUTPUT

      - name: Send to Gemini
        if: steps.diff.outputs.diff_exists == 'true'
        id: gemini
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          # Usamos un archivo temporal para el JSON para evitar problemas de escape en la shell
          cat << 'EOF' > prompt_template.txt
          Eres un Senior Software Engineer. Analiza el siguiente diff y responde en español usando Markdown.
          IMPORTANTE: No inventes problemas, no reescribas archivos completos, muestra solo snippets corregidos.
          
          Estructura:
          ## Resumen del PR
          ## Problemas detectados
          ## Problemas de seguridad
          ## Performance
          ## Mejoras recomendadas
          ## Score
          Score: [número 1-10]
          
          Diff:
          EOF
          
          cat pr_trimmed.diff >> prompt_template.txt
          
          # Construcción segura del JSON con jq
          PROMPT_CONTENT=$(cat prompt_template.txt)
          jq -n --arg msg "$PROMPT_CONTENT" '{contents: [{parts: [{text: $msg}]}]}' > request.json

          RESPONSE=$(curl -s -X POST \
            -H "Content-Type: application/json" \
            "https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview:generateContent?key=$GEMINI_API_KEY" \
            -d @request.json)

          # Extraer texto y manejar errores de la API
          COMMENT=$(echo "$RESPONSE" | jq -r '.candidates[0].content.parts[0].text // "⚠️ Error: No se pudo generar el review."')
          
          # Guardar en un archivo para evitar problemas con variables de entorno multilínea
          echo "review_comment<<EOF" >> $GITHUB_OUTPUT
          echo "$COMMENT" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Process Score and Comment
        uses: actions/github-script@v7
        env:
          COMMENT: ${{ steps.gemini.outputs.review_comment }}
        with:
          script: |
            const commentBody = process.env.COMMENT;
            const scoreMatch = commentBody.match(/Score[:\s]+(\d+)/i);
            const score = scoreMatch ? parseInt(scoreMatch[1]) : 10;
            
            let emoji = "🟢";
            if (score < 5) emoji = "🔴";
            else if (score < 8) emoji = "🟡";

            const finalBody = `## 🤖 AI Code Review ${emoji}\n\n**Score:** ${score}/10\n\n${commentBody}\n\n--- \n_Generado por Gemini 3 Flash_`;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number
            });

            const botComment = comments.find(c => c.body.includes("🤖 AI Code Review"));

            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: finalBody
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: finalBody
              });
            }

            if (score < 5) {
              core.setFailed(`PR bloqueado: Score insuficiente (${score}/10)`);
            }
