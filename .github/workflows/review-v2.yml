name: AI PR Review PRO

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ai-pr-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get PR files
        run: |
          curl -s \
            -H "Authorization: Bearer ${{ github.token }}" \
            ${{ github.api_url }}/repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/files \
            > files.json

      - name: Filter relevant files
        run: |
          jq -r '
          .[]
          | select(.patch != null)
          | select(.patch | length > 80)
          | select(.filename | test("node_modules|dist|build|coverage|\\.lock|\\.snap|\\.map|\\.min\\.js") | not)
          | select(.filename | test("\\.(ts|tsx|js|jsx|py|go|java|rs|cs|cpp|c|kt|swift)$"))
          | .filename + "|||SPLIT|||" + (.patch | split("\n")[:250] | join("\n"))
          ' files.json > filtered.txt

      - name: Stop if nothing to review
        run: |
          if [ ! -s filtered.txt ]; then
            echo "No relevant code changes"
            exit 0
          fi

      - name: Build batches
        run: |
          mkdir batches
          BATCH=0
          COUNT=0
          CURRENT=""

          while IFS='|||SPLIT|||' read -r FILE PATCH
          do
            CURRENT="${CURRENT}\n\nFile: $FILE\n$PATCH"
            COUNT=$((COUNT + 1))

            if [ "$COUNT" -ge 4 ]; then
              echo "$CURRENT" > batches/batch_$BATCH.txt
              BATCH=$((BATCH + 1))
              COUNT=0
              CURRENT=""
            fi
          done < filtered.txt

          if [ ! -z "$CURRENT" ]; then
            echo "$CURRENT" > batches/batch_$BATCH.txt
          fi

      - name: Run Gemini in parallel
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          mkdir results

          for file in batches/*.txt
          do
          (
            CONTENT=$(cat "$file")

            PROMPT="Eres un Senior Software Engineer haciendo code review.

            Analiza los siguientes cambios de un PR.
            
            $CONTENT
            
            Reglas:
            - No inventes problemas.
            - Sé conciso.
            - Si no hay problemas, dilo.
            
            Responde SOLO en JSON válido:
            
            {
              \"summary\": \"breve resumen\",
              \"issues\": [
                {
                  \"file\": \"ruta\",
                  \"line\": numero,
                  \"comment\": \"explicación breve\"
                }
              ],
              \"score\": numero
            }
            "

            JSON=$(jq -n --arg prompt "$PROMPT" \
            '{contents:[{parts:[{text:$prompt}]}]}')

            curl -s \
              -H "Content-Type: application/json" \
              "https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview:generateContent?key=$GEMINI_API_KEY" \
              -d "$JSON" \
              | jq -r '.candidates[0].content.parts[0].text // empty' \
              > results/$(basename "$file").json

          ) &
          done

          wait

      - name: Combine AI results
        run: |
          TOTAL=0
          COUNT=0
          echo "" > review.md
          echo "[]" > issues.json

          for f in results/*.json
          do
            if [ ! -s "$f" ]; then
              continue
            fi

            SUMMARY=$(jq -r '.summary // empty' "$f")
            SCORE=$(jq -r '.score // 10' "$f")

            if [ ! -z "$SUMMARY" ]; then
              echo "### Batch review" >> review.md
              echo "$SUMMARY" >> review.md
              echo "" >> review.md
            fi

            TOTAL=$((TOTAL + SCORE))
            COUNT=$((COUNT + 1))

            jq -s '.[0] + .[1].issues' issues.json "$f" > tmp.json
            mv tmp.json issues.json
          done

          if [ "$COUNT" -eq 0 ]; then
            FINAL_SCORE=10
          else
            FINAL_SCORE=$((TOTAL / COUNT))
          fi

          echo "FINAL_SCORE=$FINAL_SCORE" >> $GITHUB_ENV

          echo "COMMENT<<EOF" >> $GITHUB_ENV
          echo "## 🤖 AI Code Review" >> $GITHUB_ENV
          cat review.md >> $GITHUB_ENV
          echo "" >> $GITHUB_ENV
          echo "## Score final" >> $GITHUB_ENV
          echo "Score: $FINAL_SCORE / 10" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      - name: Comment summary
        uses: actions/github-script@v7
        with:
          script: |
            const score = parseInt(process.env.FINAL_SCORE)

            let emoji = "🟢"
            if (score < 5) emoji = "🔴"
            else if (score < 8) emoji = "🟡"

            const body = `
            ## 🤖 AI Code Review ${emoji}

            ${process.env.COMMENT}

            ---
            Generated automatically
            `

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number
            })

            const botComment = comments.find(c =>
              c.body.includes("🤖 AI Code Review")
            )

            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body
              })
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body
              })
            }

      - name: Create inline comments
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs')

            if (!fs.existsSync("issues.json")) return

            const issues = JSON.parse(fs.readFileSync("issues.json"))

            for (const issue of issues) {

              if (!issue.file || !issue.line) continue

              try {
                await github.rest.pulls.createReviewComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  pull_number: context.issue.number,
                  body: issue.comment,
                  commit_id: context.payload.pull_request.head.sha,
                  path: issue.file,
                  line: issue.line,
                  side: "RIGHT"
                })
              } catch(e) {
                console.log("Failed comment", e.message)
              }
            }

      - name: Block PR if score low
        run: |
          echo "Score final: $FINAL_SCORE"

          if [ "$FINAL_SCORE" -lt 5 ]; then
            echo "❌ PR bloqueado"
            exit 1
          fi
