name: AI PR Review con Gemini

on:
  pull_request:
    types: [opened, synchronize]

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gemini Code Review
        # Usaremos una acción popular compatible con Google AI
        uses: google-gemini/gemini-github-action@v1
        with:
          gemini_api_key: ${{ secrets.GEMINI_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          # Puedes personalizar el modelo, por ejemplo gemini-1.5-flash (más rápido/barato)
          model: 'gemini-1.5-flash'
          # Instrucciones específicas en español
          system_instruction: "Eres un revisor de código experto. Revisa el diff del PR, encuentra errores y sugiere mejoras en español."
