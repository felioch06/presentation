name: AI PR Review

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Get changed files
        id: files
        run: |
          curl -s \
            -H "Authorization: Bearer ${{ github.token }}" \
            "${{ github.event.pull_request.url }}/files" \
            > files.json

          jq -r '.[].patch' files.json > diff.txt

      - name: Ask Gemini for review
        id: ai
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |

          DIFF=$(head -c 15000 diff.txt)

          PROMPT=$(cat <<EOF
          Actúa como un Senior Software Engineer haciendo code review.

          Analiza el siguiente diff de un Pull Request.

          Responde SIEMPRE en español.

          Estructura tu respuesta en Markdown:

          ## Resumen del PR

          ## Problemas detectados
          - bugs
          - edge cases
          - errores potenciales

          ## Problemas de seguridad

          ## Problemas de performance

          ## Mejoras recomendadas
          - clean code
          - refactoring
          - buenas prácticas

          ## Score del PR
          Puntúa del 1 al 10 y explica por qué.

          Diff del PR:

          $DIFF
          EOF
          )

          RESPONSE=$(curl -s \
            -H "Content-Type: application/json" \
            "https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=$GEMINI_API_KEY" \
            -d "$(jq -n --arg prompt "$PROMPT" '{contents:[{parts:[{text:$prompt}]}]}')")

          COMMENT=$(echo $RESPONSE | jq -r '.candidates[0].content.parts[0].text')

          echo "COMMENT<<EOF" >> $GITHUB_ENV
          echo "$COMMENT" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      - name: Comment PR
        uses: actions/github-script@v7
        with:
          script: |
            const comment = `
            ## 🤖 AI Code Review

            ${process.env.COMMENT}

            ---
            _Review generado automáticamente con Gemini_
            `

            await github.rest.issues.createComment({
              ...context.repo,
              issue_number: context.issue.number,
              body: comment
            })
