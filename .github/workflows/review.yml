name: Gemini PR Reviewer

on:
  pull_request:
    types: [opened, synchronize]

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Gemini AI Review
        # Esta acción es específica para Gemini y está activa
        uses: google-gemini/gemini-github-action@main
        with:
          gemini_api_key: ${{ secrets.GEMINI_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          model: "gemini-1.5-flash"
          # Instrucciones en español para que el review sea útil
          system_instruction: |
            Eres un Senior Developer. Tu tarea es revisar el pull request.
            1. Sé crítico pero constructivo.
            2. Responde siempre en español.
            3. Si el código está bien, felicita al autor.
            4. Si hay errores o mejoras (rendimiento, seguridad), indica la línea exacta.
