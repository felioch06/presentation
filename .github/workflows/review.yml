name: AI PR Review

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Get PR diff
        run: |
          curl -s \
            -H "Authorization: Bearer ${{ github.token }}" \
            -H "Accept: application/vnd.github.v3.diff" \
            ${{ github.event.pull_request.url }} > pr.diff

          # limit diff size
          head -c 120000 pr.diff > pr_trimmed.diff

      - name: Send diff to Gemini
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |

          DIFF=$(cat pr_trimmed.diff)

          PROMPT="Eres un Senior Software Engineer haciendo code review.

          Analiza el siguiente diff de un Pull Request.

          Responde en español usando Markdown.

          Estructura EXACTA:

          ## Resumen del PR

          ## Problemas detectados

          ## Problemas de seguridad

          ## Performance

          ## Mejoras recomendadas

          ## Score
          Score: numero entre 1 y 10

          Diff:
          $DIFF"

          JSON=$(jq -n --arg prompt "$PROMPT" \
          '{contents:[{parts:[{text:$prompt}]}]}')

          RESPONSE=$(curl -s \
            -H "Content-Type: application/json" \
            "https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview:generateContent?key=$GEMINI_API_KEY" \
            -d "$JSON")

          echo "$RESPONSE"

          COMMENT=$(echo "$RESPONSE" | jq -r '.candidates[0].content.parts[0].text // "No se pudo generar review."')

          echo "COMMENT<<EOF" >> $GITHUB_ENV
          echo "$COMMENT" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      - name: Extract Score
        run: |
          SCORE=$(echo "$COMMENT" | grep -oE 'Score[: ]+[0-9]+' | grep -oE '[0-9]+' | head -1)

          if [ -z "$SCORE" ]; then
            SCORE=10
          fi

          echo "Score detectado: $SCORE"

          echo "SCORE=$SCORE" >> $GITHUB_ENV

      - name: Comment PR
        uses: actions/github-script@v7
        with:
          script: |
            const score = process.env.SCORE

            let emoji = "🟢"
            if (score < 5) emoji = "🔴"
            else if (score < 8) emoji = "🟡"

            const body = `
            ## 🤖 AI Code Review ${emoji}

            **Score:** ${score}/10

            ${process.env.COMMENT}

            ---
            Review generado automáticamente con Gemini
            `

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body
            })

      - name: Fail if score < 5
        run: |
          echo "Score obtenido: $SCORE"

          if [ "$SCORE" -lt 5 ]; then
            echo "❌ PR bloqueado: Score menor a 5"
            exit 1
          fi
