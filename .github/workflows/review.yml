name: AI PR Review

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Get PR diff
        run: |
          curl -s \
            -H "Authorization: Bearer ${{ github.token }}" \
            -H "Accept: application/vnd.github.v3.diff" \
            ${{ github.event.pull_request.url }} > pr.diff

          head -c 8000 pr.diff > pr_trimmed.diff

      - name: Call Gemini API
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |

          DIFF=$(cat pr_trimmed.diff)

          PROMPT="Eres un Senior Software Engineer haciendo code review.

Analiza el siguiente diff de un Pull Request.

Responde en español en Markdown con:

## Resumen
## Problemas detectados
## Seguridad
## Performance
## Mejoras recomendadas
## Score del PR (1-10)

Diff:
$DIFF"

          JSON=$(jq -n --arg prompt "$PROMPT" \
          '{contents:[{parts:[{text:$prompt}]}]}')

          RESPONSE=$(curl -s \
            -X POST \
            -H "Content-Type: application/json" \
            "https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash-latest:generateContent?key=$GEMINI_API_KEY" \
            -d "$JSON")

          echo "$RESPONSE"

          ERROR=$(echo "$RESPONSE" | jq -r '.error.message // empty')

          if [ ! -z "$ERROR" ]; then
            COMMENT="❌ Error al llamar Gemini:

$ERROR"
          else
            COMMENT=$(echo "$RESPONSE" | jq -r '.candidates[0].content.parts[0].text // empty')
          fi

          if [ -z "$COMMENT" ]; then
            COMMENT="⚠️ Gemini no devolvió review."
          fi

          echo "COMMENT<<EOF" >> $GITHUB_ENV
          echo "$COMMENT" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      - name: Comment PR
        uses: actions/github-script@v7
        with:
          script: |
            const body = `## 🤖 AI Code Review

${process.env.COMMENT}

---
Review generado automáticamente con Gemini
`

            await github.rest.issues.createComment({
              ...context.repo,
              issue_number: context.issue.number,
              body
            })
