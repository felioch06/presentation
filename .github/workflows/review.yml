name: Gemini AI Code Review

on:
  pull_request:
    types: [opened, synchronize]

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Gemini Code Review
        # Esta es una versión funcional y mantenida
        uses: coderabbitai/ai-pr-reviewer@v1.11
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        with:
          debug: false
          # Aquí especificamos que use Gemini
          provider: google
          model: gemini-1.5-flash
          language: es-ES
          system_message: |
            Eres un revisor de código experto. 
            Responde siempre en español.
            Enfócate en errores lógicos y seguridad.
